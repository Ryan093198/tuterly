name: Blog writer

on:
  schedule:
    # Mon/Wed/Fri at 07:00 AEST (21:00 UTC previous day).
    # AEDT shifts this to 08:00 - acceptable.
    # Day numbers: 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat
    - cron: "0 21 * * 0,2,4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  write-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install agent deps
        working-directory: agent
        run: npm install @anthropic-ai/sdk

      - name: Write blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node agent/blog-writer.js

      - name: Commit and push new post
        run: |
          git config user.name "tuterly-research-bot"
          git config user.email "bot@tuterly.com.au"
          git add content/learn agent/topics-written.json
          if git diff --cached --quiet; then
            echo "No new post written - skipping commit."
            exit 0
          fi
          git commit -m "Auto blog post [skip ci]"
          git push
